<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceder | Mi Blog</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <div class="login-page">

        <div class="login-box">

            <div class="login-logo">✦</div>

            <h1>Mi Blog</h1>
            <p class="login-subtitle">Panel privado</p>

            <form id="loginForm">

                <label for="username">Usuario</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Usuario"
                    required
                >

                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Contraseña"
                    required
                >

                <button type="submit">
                    Entrar
                </button>

                <p id="loginError" class="login-error"></p>

            </form>

            <a href="/" class="back-link">
                ← Volver al blog
            </a>

        </div>

    </div>

    <script src="/login.js"></script>

</body>
</html>
